name: security-scan
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: "Install pinned scanners (CI only; the plugin itself needs no packages)"
        run: python -m pip install --no-cache-dir "bandit==1.9.4" "detect-secrets==1.5.0"
      - name: Python security lint (fails on medium or high severity)
        run: bandit -q -r toolkit tests knowledge -ll -ii
      - name: Secrets (fails on anything not in the audited baseline)
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
      - name: "Repository secret scan (own rules for credentials, org ids, IPs, e-mails, local paths)"
        run: python toolkit/tools/secret_scan.py .
